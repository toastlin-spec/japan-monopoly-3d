<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="回合制 3D 大富翁：從台灣出發玩遍北海道到沖繩，支援真人與 AI 對手、祭典小遊戲。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>大富翁日本之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: full-bleed 3D table at night; HUD floats in the corners as lacquered indigo (藍染) panels with gold-leaf hairlines */
:root{
  --ink:#0e1220;
  --panel:rgba(17,25,46,.88);
  --panel-solid:#151f38;
  --line:rgba(216,180,106,.34);
  --gold:#d8b46a;
  --fg:#f2eee5;
  --muted:#a6afc4;
  --shu:#d4432a;
  --shu-hi:#ea5a3e;
  --sakura:#f3b4c6;
  --fate:#3f7fd0;
  --good:#5cc08a;
  --bad:#ef6b5b;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 40%,#2a211b 0%,#16110e 55%,#0b0908 100%);color:var(--fg);font-family:var(--f-body);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
.btn{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--shu-hi),var(--shu));border-color:#f08a6e;color:#fff;box-shadow:0 4px 14px rgba(212,67,42,.35)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#f46b4f,var(--shu-hi))}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.mark{width:36px;height:36px;border-radius:8px;background:var(--shu);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.06em;display:block}
.brand small{color:var(--gold);font-size:12px;letter-spacing:.08em;white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools .btn{background:var(--panel);backdrop-filter:blur(8px)}

/* players */
#players{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:calc(env(safe-area-inset-left,0px) + 12px);width:232px;display:flex;flex-direction:column;gap:8px;z-index:4}
.pc{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:9px 12px 9px 9px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:12px;backdrop-filter:blur(8px);transition:transform .2s,box-shadow .2s}
.pc.on{transform:translateX(6px);box-shadow:0 0 0 1px var(--pc),0 8px 24px rgba(0,0,0,.4)}
.pc.out{opacity:.4;filter:grayscale(1)}
.tk{width:38px;height:38px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.pn{min-width:0}
.pn b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink);background:var(--gold);border-radius:4px;padding:0 4px;margin-right:5px;vertical-align:2px}
.pn small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cash{font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.cash small{display:block;font-size:10px;color:var(--muted);font-weight:500}

/* dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;z-index:5;max-width:calc(100% - 24px)}
#turnChip{display:flex;align-items:center;gap:10px;min-width:0}
#turnChip .tk{width:32px;height:32px;font-size:15px}
#turnChip b{display:block;font-size:14px;white-space:nowrap}
#turnChip small{color:var(--muted);font-size:11px;white-space:nowrap}
#diceReadout{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--gold);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px}
#btnRoll{font-size:16px;padding:11px 22px}

/* log */
#log{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:270px;max-height:210px;display:flex;flex-direction:column;z-index:4;padding:10px 12px}
#log h3{margin:0 0 6px;font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700}
#logList{margin:0;padding:0;list-style:none;overflow-y:auto;font-size:12px;line-height:1.55;color:#d9dbe4;display:flex;flex-direction:column;gap:2px}
#logList li{padding-left:8px;border-left:2px solid var(--lc,transparent)}
#logList em{font-style:normal;font-weight:700;color:var(--fg)}
.up{color:var(--good)}.down{color:var(--bad)}

/* toast + floats */
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);left:50%;transform:translate(-50%,-8px);padding:10px 18px;background:var(--panel-solid);border:1px solid var(--gold);border-radius:999px;font-weight:700;z-index:8;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#floats{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.float{position:absolute;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.7),0 0 1px #000;white-space:nowrap;transform:translate(-50%,-50%)}

/* tile info */
#info{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 76px);width:260px;z-index:6;padding:0;overflow:hidden}
.tile-card .band{padding:10px 14px;color:#fff;font-size:12px;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center}
.tile-card .body{padding:12px 14px 14px}
.tile-card h4{margin:0 0 2px;font-family:var(--f-display);font-weight:900;font-size:22px}
.rent{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;font-variant-numeric:tabular-nums}
.rent td{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.rent td:last-child{text-align:right;font-weight:700}
.rent tr.cur td{color:var(--gold)}
.x{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1;padding:2px 4px}

/* modal */
#modalLayer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,8,14,.45);padding:16px}
.modal{background:linear-gradient(180deg,#1a2544,#121a31);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .22s ease-out}
.modal.wide{width:min(620px,100%)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 6px;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;text-wrap:balance}
.modal p{line-height:1.65;margin:6px 0}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* cards */
.cardbox{display:grid;place-items:center;perspective:900px;margin:6px 0 4px}
.jcard{width:230px;min-height:300px;border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;animation:flip .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 14px 40px rgba(0,0,0,.45);position:relative;color:#3a1020}
.jcard.chance{background:linear-gradient(160deg,#ffd9e4,#f4a9bf)}
.jcard.fate{background:linear-gradient(160deg,#d6e6fb,#93b9ea);color:#0f2346}
.jcard .kind{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.3em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.6)}
.jcard .glyph{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:1;opacity:.85}
.jcard h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:24px}
.jcard p{margin:0;font-size:15px;line-height:1.6;font-weight:500}
.jcard::after{content:"";position:absolute;inset:8px;border:1.5px dashed rgba(255,255,255,.7);border-radius:11px;pointer-events:none}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.pick3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pick3 .jcard{width:170px;min-height:230px;padding:16px 12px;cursor:pointer;transition:transform .15s}
.pick3 .jcard:hover{transform:translateY(-4px)}
.pick3 .jcard h3{font-size:18px}.pick3 .jcard p{font-size:13px}.pick3 .jcard .glyph{font-size:40px}

/* wheel */
.wheel-wrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto;max-width:100%}
.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 10px #c99a2e,0 0 0 14px #8a6416,0 14px 40px rgba(0,0,0,.5)}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--shu);z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

/* list rows (manage) */
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:rgba(255,255,255,.04);border-radius:10px}
.row .sw{width:6px;align-self:stretch;border-radius:3px}
.row b{font-size:14px}.row small{display:block;color:var(--muted);font-size:11px}
.row .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.lv{color:var(--gold);letter-spacing:1px}
select,input[type=text]{background:#0e1529;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:inherit;min-width:0}

/* minigames */
.mg canvas{width:100%;max-width:100%;display:block;border-radius:12px;background:#0b1122}
.lanterns{display:flex;gap:14px;justify-content:center;margin:10px 0}
.lantern{width:40px;height:54px;border-radius:45% 45% 40% 40%;background:#2b3350;border:2px solid #4a5376;transition:all .3s}
.lantern.lit{background:radial-gradient(circle at 50% 45%,#fff3c4,#ffb13b 45%,#d4432a);border-color:#ffd27a;box-shadow:0 0 22px #ff9d2e}
.lantern.miss{background:#3a2026;border-color:#6b2f37}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pads .btn{font-size:24px;padding:14px 0}
.gassho{width:150px;height:150px;border-radius:50%;margin:14px auto 6px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#e2523a,#9c2414);border:3px solid #f2b58f;font-family:var(--f-display);font-weight:900;font-size:22px;color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .15s,box-shadow .15s}
.gassho.hold{transform:scale(.94);box-shadow:0 0 0 10px rgba(226,82,58,.25),0 0 40px rgba(226,82,58,.6)}
.timer{text-align:center;font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--gold);min-height:40px;font-variant-numeric:tabular-nums}

/* setup */
#setup{position:fixed;inset:0;z-index:30;overflow-y:auto;background:radial-gradient(ellipse at 70% 20%,rgba(212,67,42,.18),transparent 55%),linear-gradient(180deg,rgba(10,13,24,.82),rgba(10,13,24,.94));padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:1fr 1.25fr;gap:32px;align-items:start;min-height:100%}
.hero{padding-top:24px}
.hero .eyebrow{font-size:12px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,7vw,72px);line-height:1.02;margin:10px 0 14px;letter-spacing:.02em;text-wrap:balance}
.hero h1 span{color:var(--shu-hi);display:block}
.hero p{color:#cfd3df;line-height:1.75;max-width:34ch}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.route span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:#dfe2ea}
.route span b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.setup-card{padding:20px}
.setup-card h2{margin:0 0 12px;font-size:13px;letter-spacing:.14em;color:var(--gold)}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border-left:4px solid var(--pc)}
.slot.off{opacity:.5}
.slot input{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{white-space:nowrap;background:none;border:0;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.opts{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;margin-top:16px}
.opts label{color:var(--muted);font-size:13px}
#btnStart{width:100%;margin-top:18px;font-size:18px;padding:14px}

.m-only{display:none}
@media (max-width:760px){
  .brand b{display:none}
  .tools{flex-wrap:nowrap;gap:4px}
  .brand{padding:6px 10px 6px 6px}.mark{width:30px;height:30px;font-size:16px}
  .tools .btn{padding:7px 8px;font-size:12px}
  .m-only{display:inline-block}
  #players{top:calc(env(safe-area-inset-top,0px) + 64px);left:8px;right:8px;width:auto;flex-direction:row;overflow-x:auto;gap:6px}
  .pc{grid-template-columns:26px auto;gap:6px;padding:6px 8px 6px 6px;flex:0 0 auto}
  .pc .tk{width:26px;height:26px;font-size:12px}
  .pc .pn small{display:none}
  .pc .cash{grid-column:2;text-align:left;font-size:13px}
  .pc .cash small{display:none}
  .pc.on{transform:translateY(2px)}
  .pc .pn b{font-size:12px;max-width:80px}
  #log{display:none;left:8px;right:8px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 88px)}
  #log.open{display:flex}
  #dock{left:8px;right:8px;transform:none;max-width:none;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:8px}
  #turnChip small{display:none}
  .actions{flex:1 1 100%}.actions .btn{flex:1}
  #info{left:8px;right:8px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
  #toast{top:calc(env(safe-area-inset-top,0px) + 120px)}
  .setup-in{grid-template-columns:1fr;gap:12px}
  .hero{padding-top:4px}
  .slot{grid-template-columns:30px 1fr auto}.slot .seg button{padding:7px 9px}
}
body.pre #top,body.pre #players,body.pre #dock,body.pre #log{visibility:hidden}

/* card illustrations */
.jcard .art{width:100%;max-width:196px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.15)}
.jcard .art svg{display:block;width:100%;height:auto;font-family:var(--f-body)}
.pick3 .jcard .art{max-width:146px}
.a-zx{animation:zx 1.9s linear infinite}
.a-fly{animation:fly 2.6s ease-in-out infinite}
.a-step{animation:step 2s infinite;opacity:0}
.a-rise{animation:rise 2s ease-out infinite;opacity:0}
.a-fall{animation:fall 1.7s ease-in infinite;opacity:0}
.a-spin{animation:spin 5s linear infinite;transform-box:fill-box;transform-origin:center}
.a-wave{animation:wave .8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.a-flag{animation:flag 1s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
.a-swing{animation:swing 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.a-bob{animation:bob 1.2s ease-in-out infinite}
.a-tw{animation:tw 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-rain{animation:rain .6s linear infinite}
.a-flick{animation:flick .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.a-hammer{animation:hammer .6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.a-climb{animation:climb 2.8s ease-in-out infinite}
.a-shake{animation:shake .25s linear infinite}
@keyframes zx{from{transform:translateX(-110px)}to{transform:translateX(270px)}}
@keyframes fly{from{transform:translate(-30px,104px) rotate(-18deg)}to{transform:translate(232px,14px) rotate(-18deg)}}
@keyframes step{0%{opacity:0}10%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:.95}100%{transform:translateY(-22px);opacity:0}}
@keyframes fall{0%{transform:translateY(-36px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(78px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(14deg)}}
@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-9deg) scaleX(.9)}}
@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.15);opacity:1}}
@keyframes rain{from{transform:translate(6px,-30px)}to{transform:translate(-6px,40px)}}
@keyframes flick{from{transform:scaleY(.8) scaleX(1.1)}to{transform:scaleY(1.2) scaleX(.85)}}
@keyframes hammer{0%,100%{transform:rotate(-40deg)}55%{transform:rotate(12deg)}}
@keyframes climb{0%{transform:translate(42px,106px)}50%{transform:translate(72px,64px)}100%{transform:translate(100px,36px)}}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<header id="top">
  <div class="brand panel" title="大富翁・日本之旅"><span class="mark">旅</span><div><b>大富翁・日本之旅</b><small id="roundTxt">準備出發</small></div></div>
  <div class="tools">
    <button class="btn" id="btnCam">視角：跟隨</button>
    <button class="btn" id="btnSound">音效：開</button>
    <button class="btn" id="btnRules">規則</button>
    <button class="btn m-only" id="btnLog">紀錄</button>
  </div>
</header>
<aside id="players"></aside>

}

}

const sfx={ctx:null,on:true,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},

  noise(d,v=.2,delay=0,freq=2000){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+delay;const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=c.createGain();g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t);},

/* ================= THREE SETUP ================= */
if(THREE.ColorManagement)THREE.ColorManagement.legacyMode=false;

const S_C=1.7,S_W=1.0,S=2*S_C+9*S_W,TOP=.302;
function mStd(color,r=.6,m=0,extra={}){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:r,metalness:m,envMapIntensity:m>.5?1:.35},extra));}
function porcelain(color){return new THREE.MeshPhysicalMaterial({color,roughness:.3,metalness:0,clearcoat:1,clearcoatRoughness:.1,envMapIntensity:.6});}

/* ---------- tile geometry ---------- */
function tileRect(i){
  const h=S/2,cc=h-S_C/2,q=Math.PI/4;
  if(i===0) return {x:cc,z:cc,w:S_C,d:S_C,lw:S_C,lh:S_C,rot:-q,out:[1,1],corner:true};
  if(i===10) return {x:-cc,z:cc,w:S_C,d:S_C,lw:S_C,lh:S_C,rot:q,out:[-1,1],corner:true};
  if(i===20) return {x:-cc,z:-cc,w:S_C,d:S_C,lw:S_C,lh:S_C,rot:3*q,out:[-1,-1],corner:true};
  if(i===30) return {x:cc,z:-cc,w:S_C,d:S_C,lw:S_C,lh:S_C,rot:-3*q,out:[1,-1],corner:true};
  let k;
  if(i<10){k=i-1;return {x:h-S_C-(k+.5)*S_W,z:cc,w:S_W,d:S_C,lw:S_W,lh:S_C,rot:0,out:[0,1]};}
  if(i<20){k=i-11;return {x:-cc,z:h-S_C-(k+.5)*S_W,w:S_C,d:S_W,lw:S_W,lh:S_C,rot:Math.PI/2,out:[-1,0]};}
  if(i<30){k=i-21;return {x:-h+S_C+(k+.5)*S_W,z:-cc,w:S_W,d:S_C,lw:S_W,lh:S_C,rot:Math.PI,out:[0,-1]};}
  k=i-31;return {x:cc,z:-h+S_C+(k+.5)*S_W,w:S_C,d:S_W,lw:S_W,lh:S_C,rot:-Math.PI/2,out:[1,0]};
}
function tileFrame(i){
  const r=tileRect(i);const out=new V3(r.out[0],0,r.out[1]).normalize();const along=new V3(-out.z,0,out.x);
  return {c:new V3(r.x,TOP,r.z),out,along,r};
}
function slotPos(i,slot){
  const f=tileFrame(i);
  const a=[-.2,.2,-.2,.2][slot],o=[.32,.32,-.06,-.06][slot];
  const k=f.r.corner?1.5:1;
  return f.c.clone().addScaledVector(f.along,a*k).addScaledVector(f.out,o*k+(f.r.corner?.15:0));
}

/* ---------- board texture ---------- */
const FONT_D='"Noto Serif TC","Songti TC","PMingLiU",serif';
const FONT_B='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function wrapLines(ctx,text,maxW){
  const out=[];let line='';
  for(const ch of text){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch;}else line=t;}
  if(line)out.push(line);return out;
}
function seigaiha(ctx,x0,y0,w,h,r,bg,stroke){
  ctx.save();ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.clip();
  let row=0;
  for(let y=y0-r;y<y0+h+r;y+=r/2,row++){
    const off=(row%2)*r;
    for(let x=x0-2*r+off;x<x0+w+2*r;x+=2*r){
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
      for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(x,y,r*(1-k*.23),0,Math.PI*2);ctx.strokeStyle=stroke;ctx.lineWidth=r*.07;ctx.stroke();}
    }
  }
  ctx.restore();
}
function drawBoard(){
  const N=3072,ppu=N/S;const cv=document.createElement('canvas');cv.width=cv.height=N;const ctx=cv.getContext('2d');
  // paper
  ctx.fillStyle='#f1e9d8';ctx.fillRect(0,0,N,N);
  for(let i=0;i<9000;i++){ctx.strokeStyle=`rgba(${120+Math.random()*60|0},${100+Math.random()*40|0},70,${Math.random()*.06})`;ctx.lineWidth=Math.random()*2;const x=Math.random()*N,y=Math.random()*N,a=Math.random()*6.3,l=4+Math.random()*18;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);ctx.stroke();}
  // center field
  const ci=S_C*ppu,cw=N-2*ci;
  seigaiha(ctx,ci,ci,cw,cw,58,'#e3e9e4','rgba(52,110,120,.16)');
  const grd=ctx.createRadialGradient(N/2,N/2,cw*.1,N/2,N/2,cw*.75);grd.addColorStop(0,'rgba(241,233,216,0)');grd.addColorStop(1,'rgba(241,233,216,.85)');ctx.fillStyle=grd;ctx.fillRect(ci,ci,cw,cw);
  ctx.strokeStyle='#2a2320';ctx.lineWidth=6;ctx.strokeRect(ci,ci,cw,cw);
  ctx.strokeStyle='#b8902f';ctx.lineWidth=3;ctx.strokeRect(ci+18,ci+18,cw-36,cw-36);
  // title
  const toC=(x,z)=>[(x/S+.5)*N,(z/S+.5)*N];
  let [tx,ty]=toC(0,3.25);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`900 ${.66*ppu|0}px ${FONT_D}`;ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillText('大富翁・日本之旅',tx+6,ty+6);
  ctx.fillStyle='#b8321e';ctx.fillText('大富翁・日本之旅',tx,ty);
  ctx.font=`700 ${.17*ppu|0}px ${FONT_B}`;ctx.fillStyle='#3a3029';
  [tx,ty]=toC(0,3.9);ctx.fillText('北 海 道  →  東 京  →  京 阪 神  →  九 州 ・ 沖 繩',tx,ty);
  // dice tray
  [tx,ty]=toC(.7,1.35);ctx.strokeStyle='rgba(160,120,50,.55)';ctx.lineWidth=5;ctx.setLineDash([18,12]);ctx.beginPath();ctx.ellipse(tx,ty,1.25*ppu,.62*ppu,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  // tiles
  TILES.forEach((t,i)=>{
    const r=tileRect(i);const w=r.lw*ppu,h=r.lh*ppu;const [cx,cy]=toC(r.x,r.z);
    ctx.save();ctx.beginPath();ctx.rect(cx-r.w*ppu/2,cy-r.d*ppu/2,r.w*ppu,r.d*ppu);ctx.clip();ctx.translate(cx,cy);ctx.rotate(r.rot);
    if(r.corner) drawCorner(ctx,t,w,h,ppu);
    else drawTile(ctx,t,w,h);
    ctx.restore();
    ctx.strokeStyle='#2a2320';ctx.lineWidth=4;ctx.strokeRect(cx-r.w*ppu/2,cy-r.d*ppu/2,r.w*ppu,r.d*ppu);
  });
  ctx.strokeStyle='#2a2320';ctx.lineWidth=10;ctx.strokeRect(5,5,N-10,N-10);
  return cv;
}

/* ---------- landmark icons painted on each property tile (design box 100×70) ---------- */
function painter(ctx){
  const path=(pts)=>{ctx.beginPath();for(let i=0;i<pts.length;i+=2)i?ctx.lineTo(pts[i],pts[i+1]):ctx.moveTo(pts[i],pts[i+1]);};
  return {ctx,
    c(x,y,r,f){ctx.fillStyle=f;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();},
    e(x,y,rx,ry,f,rot=0){ctx.fillStyle=f;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fill();},
    eo(x,y,rx,ry,s,w=2,rot=0){ctx.strokeStyle=s;ctx.lineWidth=w;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.stroke();},
    r(x,y,w,h,f){ctx.fillStyle=f;ctx.fillRect(x,y,w,h);},
    p(pts,f){ctx.fillStyle=f;path(pts);ctx.closePath();ctx.fill();},
    l(pts,s,w=2){ctx.strokeStyle=s;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';path(pts);ctx.stroke();},
    a(x,y,r,a0,a1,s,w=2){ctx.strokeStyle=s;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,r,a0,a1);ctx.stroke();},
    t(txt,x,y,size,f){ctx.fillStyle=f;ctx.font=`900 ${size}px ${FONT_D}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);}
  };
}
function penguin(P,x,y,s){
  P.e(x-14*s,y,5*s,13*s,'#1d2430',-.35);P.e(x+14*s,y,5*s,13*s,'#1d2430',.35);

function makeFuji(){
  const pts=[];const H=1.75;
  for(let k=0;k<=30;k++){const y=H*k/30;const r=.32+1.75*Math.pow(1-y/H,1.65);pts.push(new THREE.Vector2(r,y));}
  pts.push(new THREE.Vector2(0,H));
  const g=new THREE.LatheGeometry(pts,96);const pos=g.attributes.position;const col=[];
  const cSnow=new THREE.Color('#f4f6fa'),cRock=new THREE.Color('#41506d'),cLow=new THREE.Color('#2f4a3a');
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);const a=Math.atan2(z,x);
    const n=1+.035*Math.sin(7*a+y*4)+.02*Math.sin(17*a+1.3)+.015*Math.sin(29*a);
    if(y<H-.01){pos.setX(i,x*n);pos.setZ(i,z*n);}
    const line=1.08+.12*Math.sin(5*a)+.1*Math.sin(11*a+1)+.05*Math.sin(23*a);
    let c;if(y>line)c=cSnow;else{const t=Math.min(1,y/line);c=cLow.clone().lerp(cRock,Math.pow(t,.7));}
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92,flatShading:false}));
  return shadowed(m);
}

const updaters=[];let lastT=performance.now();
const FUJI_H=1.75;
const fujiR=y=>.32+1.75*Math.pow(1-y/FUJI_H,1.65);
const fujiN=(a,y)=>1+.035*Math.sin(7*a+y*4)+.02*Math.sin(17*a+1.3)+.015*Math.sin(29*a);
function lavaTexture(){
  const cv=document.createElement('canvas');cv.width=64;cv.height=256;const c=cv.getContext('2d');
  c.fillStyle='#6a1203';c.fillRect(0,0,64,256);
  for(let i=0;i<170;i++){const x=Math.random()*64,y=Math.random()*256,r=4+Math.random()*13,h=Math.random();
    for(const oy of [-256,0,256]){const g=c.createRadialGradient(x,y+oy,0,x,y+oy,r);g.addColorStop(0,h>.65?'#fff2a0':h>.3?'#ffb020':'#ff5a10');g.addColorStop(1,'rgba(255,60,0,0)');c.fillStyle=g;c.fillRect(x-r,y+oy-r,2*r,2*r);}}
  const t=canvasTex(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function lavaStream(a0,yEnd,w0,mat){
  const M=44,pos=[],uv=[],idx=[];
  for(let k=0;k<=M;k++){const t=k/M,y=FUJI_H-.02-(FUJI_H-.02-yEnd)*t;const a=a0+.06*Math.sin(t*9+a0*3)+.03*Math.sin(t*23);
    const r=fujiR(y)*fujiN(a,y)*1.012+.004,w=w0*(1-.55*t)*(.85+.15*Math.sin(t*17));
    const cx=r*Math.cos(a),cz=r*Math.sin(a),tx=-Math.sin(a),tz=Math.cos(a);
    pos.push(cx-tx*w,y,cz-tz*w,cx+tx*w,y,cz+tz*w);uv.push(0,t*3,1,t*3);
    if(k<M){const b=k*2;idx.push(b,b+2,b+1,b+1,b+2,b+3);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
function smokeTexture(){const cv=document.createElement('canvas');cv.width=cv.height=64;const c=cv.getContext('2d');const g=c.createRadialGradient(32,32,2,32,32,30);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.5,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);return canvasTex(cv);}
function addLava(fuji){

  [[.75,.6,.07],[1.25,.35,.085],[1.72,.75,.06],[2.25,.5,.075],[2.85,.85,.05]].forEach(([a,y,w])=>fuji.add(lavaStream(a,y,w,mat)));
  const rim=new THREE.Mesh(new THREE.RingGeometry(.2,.31,40),mStd('#4a3b33',.95));rim.rotation.x=-Math.PI/2;rim.position.y=FUJI_H+.006;fuji.add(rim);
  const crater=new THREE.Mesh(new THREE.CircleGeometry(.21,40),mat);crater.rotation.x=-Math.PI/2;crater.position.y=FUJI_H+.004;fuji.add(crater);
  const glow=new THREE.PointLight(0xff6a2a,.9,4,2);glow.position.y=FUJI_H+.3;fuji.add(glow);
  const st=smokeTexture(),puffs=[];
  for(let k=0;k<14;k++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:st,transparent:true,depthWrite:false,color:0x8f8983}));scene.add(sp);puffs.push({sp,ph:k/14});}
  const top=new V3();

    glow.intensity=.7+.3*Math.sin(now*.006)+.15*Math.random();
    fuji.localToWorld(top.set(0,FUJI_H,0));
    puffs.forEach(o=>{const l=(now/5000+o.ph)%1;
      o.sp.position.set(top.x+l*.9+Math.sin(l*6+o.ph*9)*.12,top.y+.1+l*2.4,top.z+l*.3);
      o.sp.scale.setScalar(.3+l*1.4);o.sp.material.opacity=(l<.12?l/.12:1-(l-.12)/.88)*.7;});
  });
}

async function rollDice(n){
  const vals=[];const up=new V3(0,1,0);
  const jobs=[];
  dice.forEach((d,k)=>{d.visible=k<n;});
  for(let k=0;k<n;k++){
    const v=1+Math.floor(Math.random()*6);vals.push(v);const d=dice[k];
    const rest=DICE_REST[n===1?0:k].clone();if(n===1)rest.x=.7;
    const start=rest.clone().add(new V3(rand(-3,-2),2.4,rand(2,3)));
    const target=new THREE.Quaternion().setFromUnitVectors(DIE_NORM[v],up);target.premultiply(new THREE.Quaternion().setFromAxisAngle(up,rand(-.5,.5)));
    const q0=new THREE.Quaternion().setFromEuler(new THREE.Euler(rand(0,6),rand(0,6),rand(0,6)));
    const axis=new V3(rand(-1,1),rand(-.3,.3),rand(-1,1)).normalize();const spin=rand(14,20);
    const qt=new THREE.Quaternion(),qa=new THREE.Quaternion();
    jobs.push(tween(1250,t=>{
      d.position.x=start.x+(rest.x-start.x)*(1-Math.pow(1-t,2.2));
      d.position.z=start.z+(rest.z-start.z)*(1-Math.pow(1-t,2.2));
      const b=Math.abs(Math.cos(t*Math.PI*2.6))*Math.pow(1-t,2)*2.4;d.position.y=rest.y+b;
      qa.setFromAxisAngle(axis,spin*(1-Math.pow(1-t,2)));qt.copy(q0).premultiply(qa);
      const s=Math.min(1,Math.max(0,(t-.62)/.38));d.quaternion.copy(qt).slerp(target,s*s*(3-2*s));
    },t=>t));
  }
  sfx.dice();
  await Promise.all(jobs);
  return vals;
}

function mortgage(p,i){const s=G.props[i];if(s.level>0||s.mortgaged)return 0;s.mortgaged=true;const v=Math.round(TILES[i].price/2);p.cash+=v;updateTileVisual(i);return v;}
function unmortgageCost(i){return round10(TILES[i].price*.55);}
function liquidValue(p){let v=0;ownedBy(p).forEach(i=>{const s=G.props[i];v+=s.level*Math.round(buildCost(i)/2);if(!s.mortgaged)v+=Math.round(TILES[i].price/2);});return v;}
function aiLiquidate(p,amt){
  while(p.cash<amt){
    const withB=ownedBy(p).filter(i=>G.props[i].level>0).sort((a,b)=>G.props[b].level-G.props[a].level);
    if(withB.length){sellBuilding(p,withB[0]);continue;}
    const m=ownedBy(p).filter(i=>!G.props[i].mortgaged).sort((a,b)=>(hasMonopoly(p.id,TILES[a].group)-hasMonopoly(p.id,TILES[b].group))||TILES[a].price-TILES[b].price);
    if(m.length){mortgage(p,m[0]);continue;}
    break;
  }
  renderPlayers();
}
async function raiseFunds(p,amt,creditor){
  if(p.kind==='ai'){aiLiquidate(p,amt);if(p.cash<amt)await bankrupt(p,creditor);else log(`${pName(p)} 變賣資產籌錢`,p);return;}
  await new Promise(res=>{
    const draw=()=>{
      const rows=ownedBy(p).map(i=>{const s=G.props[i],t=TILES[i];
        return `<div class="row"><span class="sw" style="background:${GROUPS[t.group].color}"></span><div><b>${t.name}</b><small>${s.mortgaged?'抵押中':LV_NAME[s.level]}</small></div><div class="acts">
        ${s.level>0?`<button class="btn sm" data-a="sell" data-i="${i}">賣房 +${fmt(buildCost(i)/2)}</button>`:''}
        ${s.level===0&&!s.mortgaged?`<button class="btn sm" data-a="mort" data-i="${i}">抵押 +${fmt(t.price/2)}</button>`:''}</div></div>`;}).join('');
      const enough=p.cash>=amt;
      const box=openModal(`<div class="eyebrow">現金不足</div><h2>需要支付 ${fmt(amt)} 元</h2><p>目前現金 <b class="num">${fmt(p.cash)}</b> 元。賣掉建築或抵押地產來籌錢。</p><div class="rows">${rows||'<p class="muted">沒有可變賣的資產。</p>'}</div>
        <div class="mbtns"><button class="btn" id="lqBank">宣告破產</button><button class="btn primary" id="lqPay" ${enough?'':'disabled'}>支付 ${fmt(amt)} 元</button></div>`,'wide');
      box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;b.dataset.a==='sell'?sellBuilding(p,i):mortgage(p,i);renderPlayers();draw();});
      $('#lqPay').onclick=()=>{closeModal();res();};
      $('#lqBank').onclick=async()=>{closeModal();await bankrupt(p,creditor);res();};
    };
    draw();
  });
}
async function bankrupt(p,creditor){
  if(p.bankrupt)return;p.bankrupt=true;
  ownedBy(p).forEach(i=>{const s=G.props[i];
    if(creditor){if(s.level){creditor.cash+=Math.round(s.level*buildCost(i)/2);}s.owner=creditor.id;s.level=0;}
    else{s.owner=-1;s.level=0;s.mortgaged=false;}
    updateTileVisual(i);});
  if(creditor&&p.cash>0)creditor.cash+=p.cash;
  p.cash=0;p.charm=0;
  await tween(500,t=>{p.mesh.scale.setScalar(1-t);});p.mesh.visible=false;
  sfx.bad();log(`${pName(p)} <b>破產出局</b>${creditor?`，資產歸 ${pName(creditor)}`:''}`,p);
  toast(`${p.name} 破產了！`,2400);renderPlayers();
}

/* ================= MOVEMENT ================= */
async function hopTo(p,i,dur){
  const from=p.mesh.position.clone(),to=slotPos(i,p.id);const dx=to.x-from.x,dz=to.z-from.z;
  if(Math.abs(dx)+Math.abs(dz)>.01)p.mesh.rotation.y=Math.atan2(dx,dz);
  focusOn(to);
  await tween(dur,t=>{p.mesh.position.set(from.x+dx*t,TOP+Math.sin(Math.PI*t)*.42,from.z+dz*t);},t=>t);
  sfx.step();
}
async function moveSteps(p,n){
  const dir=n>=0?1:-1,cnt=Math.abs(n);const dur=cnt>8?170:230;
  for(let s=0;s<cnt;s++){
    p.pos=(p.pos+dir+40)%40;await hopTo(p,p.pos,dur);
    if(dir>0&&p.pos===0)gain(p,PASS_GO,'經過起點');
  }
}
async function flyTo(p,target){
  const passGo=target<=p.pos;
  const from=p.mesh.position.clone(),to=slotPos(target,p.id);
  focusOn(new V3((from.x+to.x)/2,0,(from.z+to.z)/2));
  p.mesh.rotation.y=Math.atan2(to.x-from.x,to.z-from.z);
  await tween(1500,t=>{p.mesh.position.lerpVectors(from,to,t);p.mesh.position.y=TOP+Math.sin(Math.PI*t)*3;p.mesh.rotation.z=Math.sin(Math.PI*t)*.3;});
  p.mesh.rotation.z=0;p.pos=target;focusOn(to);sfx.step();
  if(passGo)gain(p,PASS_GO,target===0?'抵達起點':'經過起點');
}
async function travelTo(p,target,depth,opt={}){
  const steps=(target-p.pos+40)%40;
  if(opt.fly||steps>10)await flyTo(p,target);else await moveSteps(p,steps);
  await resolveTile(p,depth+1,opt);
}
async function moveRel(p,n,depth){await moveSteps(p,n);await resolveTile(p,depth+1);}

function drawWheel(cv){
  const c=cv.getContext('2d'),R=cv.width/2;c.translate(R,R);
  WHEEL.forEach((s,k)=>{const a0=(-90-22.5+k*45)*Math.PI/180,a1=a0+Math.PI/4;
    c.beginPath();c.moveTo(0,0);c.arc(0,0,R,a0,a1);c.closePath();c.fillStyle=s.color;c.fill();c.strokeStyle='#fff8e0';c.lineWidth=4;c.stroke();
    c.save();c.rotate((k*45)*Math.PI/180);c.fillStyle=s.k==='plane'?'#5a3a10':'#fff';c.textAlign='center';c.textBaseline='middle';
    if(s.k==='plane'){c.font=`900 64px ${FONT_B}`;c.fillText('✈',0,-R*.66);}
    else if(s.k==='minus'){c.font=`900 38px ${FONT_B}`;c.fillText('-1000',0,-R*.66);}
    else{c.beginPath();const y=-R*.66;c.moveTo(-28,y+24);c.lineTo(-28,y-4);c.lineTo(0,y-28);c.lineTo(28,y-4);c.lineTo(28,y+24);c.closePath();c.fill();c.fillStyle=s.color;c.font=`900 40px ${FONT_B}`;c.fillText(s.k==='up'?'+':'−',0,y+4);}
    c.restore();});
  c.beginPath();c.arc(0,0,R*.26,0,7);const g=c.createRadialGradient(-10,-10,4,0,0,R*.26);g.addColorStop(0,'#ffe6a0');g.addColorStop(1,'#b98a22');c.fillStyle=g;c.fill();
  c.fillStyle='#6a4a0c';c.font=`900 34px ${FONT_D}`;c.textAlign='center';c.textBaseline='middle';c.fillText('轉盤',0,0);
}
async function spinWheel(p,depth){
  const box=openModal(`<div class="eyebrow">起點獎勵</div><h2>幸運轉盤</h2><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheelCv" width="560" height="560"></canvas></div><p class="muted" id="wheelMsg" style="text-align:center">${p.kind==='ai'?'電腦轉動中…':'按下「轉！」試試手氣'}</p><div class="mbtns"><button class="btn primary" id="wheelGo">轉！</button></div>`);

async function wheelUp(p){
  const el=ownedBy(p).filter(i=>TILES[i].group!=='park'&&!G.props[i].mortgaged&&G.props[i].level<4);
  if(!el.length){toast('沒有可以加蓋的地產');log(`${pName(p)} 沒有可加蓋的地產`,p);return;}
  let i;
  if(p.kind==='ai'){i=el.sort((a,b)=>TILES[b].price-TILES[a].price)[0];}
  else i=await choose(`<h2>免費加蓋一層</h2><p>選一塊地產加蓋。</p>`,el.map((j,k)=>({label:`${TILES[j].name}（${LV_NAME[G.props[j].level]}→${LV_NAME[G.props[j].level+1]}）`,value:j,primary:k===0})));
  G.props[i].level++;updateTileVisual(i);sfx.build();log(`${pName(p)} 免費在「${TILES[i].name}」加蓋為${LV_NAME[G.props[i].level]}`,p);renderPlayers();
}
function wheelDown(p){
  const el=ownedBy(p).filter(i=>G.props[i].level>0).sort((a,b)=>G.props[b].level-G.props[a].level||TILES[b].price-TILES[a].price);
  if(!el.length){toast('沒有建築，逃過一劫！');log(`${pName(p)} 沒有建築可拆`,p);return;}
  const i=el[0];G.props[i].level--;updateTileVisual(i);sfx.bad();log(`${pName(p)} 的「${TILES[i].name}」被拆掉一層`,p);renderPlayers();
}
function aiFlyTarget(p){
  const c=[];TILES.forEach((t,i)=>{if(i===p.pos||i===0)return;const s=G.props[i];
    let sc=0;if(t.type==='prop'){if(s.owner<0&&p.cash-t.price>1200)sc=t.price/100+(countOwned(p.id,t.group)+1===groupTiles(t.group).length?60:0);else if(s.owner===p.id)sc=5;else sc=-rentOf(i)/50;}
    else if(t.type==='chance')sc=8;else if(t.type==='awa'||t.type==='nebuta')sc=12;else sc=4;c.push([i,sc+Math.random()*3]);});
  return c.sort((a,b)=>b[1]-a[1])[0][0];
}
async function wheelPlane(p,depth){
  let target;
  if(p.kind==='ai'){target=aiFlyTarget(p);}
  else{
    const opts=TILES.map((t,i)=>{if(i===0||i===p.pos)return '';const s=G.props[i];

      return `<option value="${i}">${i}. ${t.name}${st}</option>`;}).join('');
    target=await new Promise(res=>{const box=openModal(`<div class="eyebrow">轉盤：飛機</div><h2>要飛去哪裡？</h2><p>經過起點同樣可以領 2000 元。</p><select id="flySel" style="width:100%">${opts}</select><div class="mbtns"><button class="btn primary" id="flyGo">起飛</button></div>`);
      $('#flyGo').onclick=()=>{const v=+$('#flySel').value;closeModal();res(v);};});
  }
  log(`${pName(p)} 搭飛機前往「${TILES[target].name}」`,p);
  await flyTo(p,target);await resolveTile(p,depth+1);
}

async function gameAwa(p){

    for(let k=0;k<NOTES;k++){await sleep(160);sfx.taiko();const r=Math.random();if(r<.45){score+=150;hits++;}else if(r<.8){score+=80;hits++;}$('#awAi').textContent=`命中 ${hits} / ${k+1}`;}

  } else {

      const BEAT=620*G.speed,TRAVEL=1700*G.speed,HITX=80;const t0=performance.now()+1200;
      const notes=Array.from({length:NOTES},(_,k)=>({t:t0+k*BEAT+(k>5?-BEAT/2*(k%2):0),d:Math.floor(Math.random()*4),j:null}));

        raf=requestAnimationFrame(draw);};
      raf=requestAnimationFrame(draw);

/* ================= TILE RESOLUTION ================= */
async function resolveTile(p,depth=0,opt={}){
  if(p.bankrupt||depth>4)return;
  const t=TILES[p.pos];
  switch(t.type){
    case 'start':await spinWheel(p,depth);break;
    case 'prop':await landProperty(p,opt);break;
    case 'chance':await drawCard(p,'chance',depth);break;
    case 'fate':await drawCard(p,'fate',depth);break;
    case 'nebuta':await gameNebuta(p);break;
    case 'gion':await gameGion(p,depth);break;
    case 'awa':await gameAwa(p);break;
  }
}
function aiWantsBuy(p,i){
  const t=TILES[i];let reserve=G.round<4?700:1400;
  if(countOwned(p.id,t.group)+1===groupTiles(t.group).length)reserve=200;
  if(t.group==='park')reserve-=300;
  return p.cash-t.price>=reserve;
}

  else rows=LV_NAME.map((nm,l)=>`<tr class="${s.owner>=0&&s.level===l?'cur':''}"><td>${l===0?'空地（獨佔地區×2）':nm}</td><td>${fmt(round10(t.price*LV_MULT[l]))}${l===0?` / ${fmt(round10(t.price*LV_MULT[0]*2))}`:''}</td></tr>`).join('');

    <h4>${t.name}</h4><div class="muted" style="font-size:12px">地價 <b class="num" style="color:var(--fg)">${fmt(t.price)}</b> 元${t.group!=='park'?` · 每層加蓋 ${fmt(buildCost(i))} 元`:''}</div>

    await payTo(p,owner,rent,`在「${t.name}」付過路費`);
  }
}

async function aiManage(p){

  for(let n=0;n<6;n++){
    const c=ownedBy(p).filter(i=>canBuild(p,i)&&p.cash-buildCost(i)>=2500).sort((a,b)=>G.props[a].level-G.props[b].level||TILES[b].price-TILES[a].price);
    if(!c.length)break;build(p,c[0]);focusOn(slotPos(c[0],p.id));await sleep(450);
  }

}

/* ================= TURN LOOP ================= */
async function takeTurn(p){
  G.turnPlayer=p;cam.hold=false;renderPlayers();setDock('wait');
  focusOn(p.mesh.position);$('#diceReadout').textContent='–';
  if(p.skip>0){p.skip--;toast(`${p.name} 休息中`);log(`${pName(p)} 休息一回合`,p);renderPlayers();await sleep(1100);return;}
  toast(`輪到 ${p.name}`,1200);
  let rolls=0;
  while(true){
    rolls++;
    if(p.kind==='human'){setDock('roll');await waitClick('#btnRoll');}else await sleep(700);
    setDock('wait');
    const vals=await rollDice(G.diceCount);const total=vals.reduce((a,b)=>a+b,0);
    const dbl=G.diceCount===2&&vals[0]===vals[1];
    $('#diceReadout').textContent=G.diceCount===2?`${vals[0]}+${vals[1]}`:`${total}`;
    log(`${pName(p)} 擲出 <b>${vals.join(' + ')}</b>${G.diceCount===2?` = ${total}`:''}${dbl?'（雙數）':''}`,p);
    await sleep(250);
    await moveSteps(p,total);
    await resolveTile(p,0);
    renderPlayers();
    if(p.bankrupt||active().length<=1)return;
    if(dbl&&rolls<3&&p.skip===0){toast('擲出雙數，再擲一次！');await sleep(700);continue;}
    break;
  }
  if(p.kind==='ai'){await aiManage(p);await sleep(500);}
  else{setDock('post');await waitClick('#btnEnd');}
}
async function gameLoop(){
  while(true){
    const p=G.players[G.cur];
    if(!p.bankrupt)await takeTurn(p);
    if(active().length<=1)break;
    let n=G.cur;do{n=(n+1)%G.players.length;}while(G.players[n].bankrupt);
    if(n<=G.cur){if(G.maxRounds&&G.round>=G.maxRounds)break;G.round++;}
    G.cur=n;renderPlayers();
  }
  gameOver();
}
function gameOver(){
  G.over=true;setDock('wait');G.turnPlayer=null;renderPlayers();sfx.win();
  const rank=G.players.slice().sort((a,b)=>(a.bankrupt-b.bankrupt)||netWorth(b)-netWorth(a));
  const w=rank[0];focusOn(w.mesh.position);
  openModal(`<div class="eyebrow">${active().length<=1?'其他旅人都破產了':`${G.maxRounds} 回合結束`}</div><h2>${esc(w.name)} 成為日本大富翁！</h2>
    <div class="rows">${rank.map((p,k)=>`<div class="row"><span class="sw" style="background:${p.color}"></span><div><b>${k+1}. ${esc(p.name)}</b><small>${p.bankrupt?'破產':`${ownedBy(p).length} 處地產 · 現金 ${fmt(p.cash)}`}</small></div><div class="cash">${fmt(p.bankrupt?0:netWorth(p))}<small>總資產</small></div></div>`).join('')}</div>
    <div class="mbtns"><button class="btn" id="goBoard">看看棋盤</button><button class="btn primary" id="goAgain">再玩一局</button></div>`,'wide');
  $('#goAgain').onclick=()=>location.reload();
  $('#goBoard').onclick=closeModal;
}

  <p><b>起點：</b>經過或停留領 2000 元，停留時再轉一次轉盤（飛機、扣款、加蓋、拆房）。</p>
  <p><b>祭典格：</b>青森睡魔祭點燈籠、京都祇園祭合掌默數三秒、德島阿波舞節奏遊戲，表現越好獎勵越多。</p>
  <p><b>破產：</b>現金不夠時可以賣房或抵押地產，仍付不出就破產出局。最後留下的人，或回合上限到時總資產最高的人獲勝。</p>
  <p class="muted">點棋盤上的景點可以查看地價和過路費。空白鍵可以擲骰子。</p>`,[{label:'知道了',value:1,primary:true}],'wide');};
addEventListener('keydown',e=>{if(e.code==='Space'&&modalLayer.hidden&&!$('#btnRoll').disabled&&$('#setup').hidden!==false){e.preventDefault();$('#btnRoll').click();}});

/* ================= SETUP ================= */
const SLOTS=[{on:true,kind:'human',name:'旅人 A'},{on:true,kind:'ai',name:'電腦・小林'},{on:true,kind:'ai',name:'電腦・佐藤'},{on:false,kind:'human',name:'旅人 D'}];
function renderSlots(){
  $('#slots').innerHTML=SLOTS.map((s,k)=>`<div class="slot ${s.on?'':'off'}" style="--pc:${TOKENS[k].color}">
    <span class="tk" style="background:${TOKENS[k].color};width:34px;height:34px;font-size:15px" title="${TOKENS[k].name}">${TOKENS[k].ch}</span>
    <input type="text" id="nm${k}" value="${esc(s.name)}" maxlength="10" aria-label="玩家 ${k+1} 名稱" ${s.on?'':'disabled'}>
    <div class="seg" role="group" aria-label="玩家 ${k+1} 類型">${['human','ai','off'].map(v=>`<button data-k="${k}" data-v="${v}" aria-pressed="${(s.on?s.kind:'off')===v}">${{human:'真人',ai:'AI',off:'關'}[v]}</button>`).join('')}</div></div>`).join('');
  document.querySelectorAll('#slots .seg button').forEach(b=>b.onclick=()=>{const s=SLOTS[+b.dataset.k];SLOTS.forEach((x,k)=>x.name=$('#nm'+k).value);if(b.dataset.v==='off')s.on=false;else{s.on=true;s.kind=b.dataset.v;}renderSlots();});
}
renderSlots();
function segVal(id){return +document.querySelector(`#${id} [aria-pressed=true]`).dataset.v;}
['optDice','optCash','optRounds','optSpeed'].forEach(id=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',x===b));}));
$('#routeChips').innerHTML=Object.entries(GROUPS).map(([k,g])=>`<span><b style="background:${g.color}"></b>${g.name}</span>`).join('');

$('#btnStart').onclick=()=>{
  SLOTS.forEach((x,k)=>x.name=$('#nm'+k).value.trim()||`旅人 ${k+1}`);
  const on=SLOTS.map((s,k)=>({...s,k})).filter(s=>s.on);
  if(on.length<2){$('#setupErr').textContent='至少需要兩位玩家（真人或 AI）。';return;}
  sfx.init();
  G.diceCount=segVal('optDice');G.maxRounds=segVal('optRounds');G.speed=segVal('optSpeed');const cash=segVal('optCash');
  G.players=on.map((s,id)=>{const tk=TOKENS[s.k];const mesh=makeToken(tk.key,tk.color);scene.add(mesh);
    const p={id,name:s.name,kind:s.kind,token:s.k,color:tk.color,cash,pos:0,skip:0,charm:0,bankrupt:false,mesh};
    mesh.position.copy(slotPos(0,id));mesh.rotation.y=-Math.PI/2;return p;});
  dice.forEach((d,k)=>d.visible=k<G.diceCount);
  $('#setup').hidden=true;document.body.classList.remove('pre');
  log('旅程開始！從台灣出發前往日本。');renderPlayers();
  gameLoop();
};

/* ================= BOOT ================= */
document.body.classList.add('pre');
buildDecor();initPetals();
dice.forEach((d,k)=>d.visible=true);
requestAnimationFrame(animate);
camOverview();
(async()=>{
  try{await Promise.race([Promise.all([document.fonts.load(`900 40px "Noto Serif TC"`,'大富翁日本之旅機會命運'),document.fonts.load(`700 40px "Noto Sans TC"`,'北海道東京都元')]),new Promise(r=>setTimeout(r,3500))]);}catch(e){}
  buildBoardTop();
  const b=$('#btnStart');b.disabled=false;b.textContent='出發！';
})();
</script>
